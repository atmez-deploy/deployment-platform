# Throwaway LIVE-TEST project for the school VPS. Deploys a tiny public image
# (nginxdemos/hello) so no app build/registry is needed. Fully isolated from acadlynk:
# its own port block (9000+), its own network/nginx conf/dirs, its own test subdomain.
# Use this to prove the pipeline end-to-end on a real server, then clean it up.
# Validate against ../schemas/project.schema.json
schema_version: "1.0"

project:
  name: hello-test
  description: Throwaway live-test service (safe, isolated from acadlynk)
  owner: platform-team

repository:
  organization: atmez-deploy
  repository: hello-test
  default_branch: main

environments:

  staging:
    deployment:
      type: docker
      strategy: blue_green
    target:
      driver: vps
      ref: school
    services:
      web:
        # public image that returns HTTP 200 on / — no build or GHCR login needed
        image: nginxdemos/hello:latest
        exposure:
          type: domain
          domain: hello-test.acadlynk.com   # create this test subdomain -> the VPS IP
          ssl: true
        health:
          path: /
          expect_status: 200
