# LIVE TEST — deploy a throwaway page to the temporary Hostinger domain over SSH/rsync.
# Safe: targets only the temporary test site's own folder. Delete this after the test.
# Connection is the account's SSH (from hPanel): 145.223.17.98:65002 as u443001285.
# The PRIVATE key is the GitHub secret DEPLOY_SSH_KEY (never in this file).
# Validate against ../schemas/project.schema.json
schema_version: "1.0"

project:
  name: hostinger-live-test
  description: Throwaway live test on the temporary Hostinger domain
  owner: platform-team

repository:
  organization: atmez-deploy
  repository: deployment-platform
  default_branch: main

environments:

  production:
    deployment:
      type: static
    target:
      driver: hostinger
      host: 145.223.17.98
      port: 65002
      username: u443001285
      auth: ssh_key
      # IMPORTANT: this is the test site's own web folder. Confirmed via File Manager as
      # the temporary domain's public_html. If the dry run shows the wrong folder, we fix
      # this one line before running for real.
      webroot: domains/mediumslateblue-mantis-944780.hostingersite.com/public_html
      transfer: rsync
      secret_ref: DEPLOY_SSH_KEY
    build:
      # No build tool needed — we ship a ready-made static page from the test folder.
      output_dir: site
    services:
      site:
        exposure:
          type: domain
          domain: mediumslateblue-mantis-944780.hostingersite.com
          ssl: managed_by_provider
        release_strategy: symlink
