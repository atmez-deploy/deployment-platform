name: Validate project configs

on:
  push:
    paths:
      - "schemas/**"
      - "examples/**"
      - "config/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/validate-schemas.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "config/**"
      - "tools/**"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run validate
      - run: npm run test:schema
