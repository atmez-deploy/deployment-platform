name: Reusable — deploy static site

# Central, reusable deployment logic. Site repos call this via `workflow_call`
# with a tiny caller workflow (see examples/caller-deploy-static.yml). The deploy
# logic lives HERE, once — update it and every site benefits.
#
# Supports both Hostinger modes:
#   auth: ssh_key -> rsync releases + atomic symlink swap
#   auth: ftps    -> lftp mirror into webroot
#
# The engine is pulled from this platform repo at a pinned ref so callers don't
# vendor any logic.

on:
  workflow_call:
    inputs:
      config:
        description: Path to the project config (in the CALLER repo)
        required: true
        type: string
      environment:
        description: Environment name
        required: false
        default: production
        type: string
      platform_ref:
        description: Ref of atmez-deploy/deployment-platform to use
        required: false
        default: main
        type: string
      execute:
        description: Actually run (false = dry run)
        required: false
        default: true
        type: boolean
    secrets:
      DEPLOY_SSH_KEY:
        required: false
      FTP_PASSWORD:
        required: false
      FTP_HOST:
        required: false
      FTP_USERNAME:
        required: false
      FTP_WEBROOT:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the CALLER repo (the site) — it holds the config + built source
      - name: Checkout site repo
        uses: actions/checkout@v4

      # 2. Check out the platform engine at a pinned ref into ./_platform
      - name: Checkout deployment platform
        uses: actions/checkout@v4
        with:
          repository: atmez-deploy/deployment-platform
          ref: ${{ inputs.platform_ref }}
          path: _platform

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install engine deps
        working-directory: _platform
        run: npm install

      # 3. Build the site from the config's build block (or a placeholder for demo)
      - name: Build
        id: build
        run: |
          CONFIG="${{ inputs.config }}"
          ENVN="${{ inputs.environment }}"
          node -e "const y=require('./_platform/node_modules/js-yaml');const fs=require('fs');const c=y.load(fs.readFileSync(process.argv[1],'utf8'));const e=c.environments[process.argv[2]];if(!e||!e.build){console.error('no build block for env');process.exit(1)};console.log(e.build.command);console.log(e.build.output_dir)" "$CONFIG" "$ENVN" > .binfo
          CMD=$(sed -n 1p .binfo); OUT=$(sed -n 2p .binfo)
          echo "output_dir=$OUT" >> "$GITHUB_OUTPUT"
          if [ -f package.json ] && grep -q '"build"' package.json; then eval "$CMD" || true; fi
          mkdir -p "$OUT"
          [ -f "$OUT/index.html" ] || echo "<h1>atmez-deploy</h1><p>${{ github.sha }}</p>" > "$OUT/index.html"

      # 4. Publish via the engine
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_WEBROOT: ${{ secrets.FTP_WEBROOT }}
        run: |
          EXECUTE=""
          if [ "${{ inputs.execute }}" = "true" ]; then EXECUTE="--execute"; fi
          node _platform/engine/cli.mjs deploy \
            --config "${{ inputs.config }}" \
            --env "${{ inputs.environment }}" \
            --sha "${{ github.sha }}" \
            --dir "${{ steps.build.outputs.output_dir }}" \
            $EXECUTE
