name: Reusable — deploy static site

# Central, reusable deployment logic. Site repos call this via `workflow_call`
# with a tiny caller workflow (see examples/caller-deploy-static.yml). The deploy
# logic lives HERE, once — update it and every site benefits.
#
# Supports both Hostinger modes (shared hosting serves the webroot directly, so both mirror):
#   auth: ssh_key -> rsync --delete mirror into webroot
#   auth: ftps    -> lftp mirror into webroot
#
# The engine is pulled from this platform repo at a pinned ref so callers don't
# vendor any logic.

on:
  workflow_call:
    inputs:
      config:
        description: Path to the project config (in the CALLER repo)
        required: true
        type: string
      environment:
        description: Environment name
        required: false
        default: production
        type: string
      platform_ref:
        description: Ref of atmez-deploy/deployment-platform to use
        required: false
        default: main
        type: string
      execute:
        description: Actually run (false = dry run)
        required: false
        default: true
        type: boolean
    secrets:
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_USERNAME:
        required: false
      DEPLOY_WEBROOT:
        required: false
      FTP_PASSWORD:
        required: false
      # Legacy connection-secret names, still accepted as a fallback.
      FTP_HOST:
        required: false
      FTP_USERNAME:
        required: false
      FTP_WEBROOT:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the CALLER repo (the site) — it holds the config + built source
      - name: Checkout site repo
        uses: actions/checkout@v4

      # 2. Check out the platform engine at a pinned ref into ./_platform
      - name: Checkout deployment platform
        uses: actions/checkout@v4
        with:
          repository: atmez-deploy/deployment-platform
          ref: ${{ inputs.platform_ref }}
          path: _platform

      # Node is set up only so the ENGINE (js-yaml) runs — NOT for the app build.
      # The app build uses whatever the project declares (any language) or a build.image.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install engine deps
        working-directory: _platform
        run: npm install

      # 3. Build the site using the project's OWN build.command (language-independent).
      #    - build.command present  -> run it exactly (npm / hugo / bundle / make / etc.)
      #    - build.image present     -> run the command inside that container (toolchain
      #                                  not tied to the runner)
      #    - build omitted / no cmd  -> no build; serve output_dir as-is (plain HTML, etc.)
      - name: Build
        id: build
        run: |
          CONFIG="${{ inputs.config }}"
          ENVN="${{ inputs.environment }}"
          # Read build.command, build.output_dir (may be empty -> auto-detect), build.image.
          node -e "const y=require('./_platform/node_modules/js-yaml');const fs=require('fs');const c=y.load(fs.readFileSync(process.argv[1],'utf8'));const e=(c.environments||{})[process.argv[2]]||{};const b=e.build||{};console.log(b.command||'');console.log(b.output_dir||'');console.log(b.image||'')" "$CONFIG" "$ENVN" > .binfo
          CMD=$(sed -n 1p .binfo); OUT=$(sed -n 2p .binfo); IMG=$(sed -n 3p .binfo)

          # Snapshot top-level dirs BEFORE the build so we can detect what it produced.
          node _platform/tools/detect-output.mjs snapshot > .before-build.json

          if [ -n "$CMD" ]; then
            if [ -n "$IMG" ]; then
              echo "Building in container image: $IMG"
              docker run --rm -v "$PWD:/src" -w /src "$IMG" sh -lc "$CMD"
            else
              echo "Building on runner: $CMD"
              sh -lc "$CMD"
            fi
          else
            echo "No build.command declared — no build step."
          fi

          # Resolve the output dir: explicit config value wins; otherwise auto-detect what
          # the build created/changed. Fails clearly if ambiguous (asks to set output_dir).
          if [ -n "$OUT" ]; then
            RESOLVED="$OUT"
            echo "output dir (explicit): $RESOLVED"
          else
            RESOLVED=$(node _platform/tools/detect-output.mjs resolve --before .before-build.json) || {
              echo "::error::could not auto-detect the build output folder. Set build.output_dir in the config.";
              exit 1;
            }
            echo "output dir (auto-detected): $RESOLVED"
          fi
          echo "output_dir=$RESOLVED" >> "$GITHUB_OUTPUT"

          mkdir -p "$RESOLVED"
          # Demo safety net ONLY when there is genuinely nothing to serve.
          if [ -z "$(ls -A "$RESOLVED" 2>/dev/null)" ]; then
            echo "<h1>atmez-deploy</h1><p>${{ github.sha }}</p>" > "$RESOLVED/index.html"
          fi

      # 3b. Preflight gate — verify config + inputs + secrets before deploying. Fails the
      #     job (non-zero exit) if anything is missing, so we never deploy a broken setup.
      - name: Preflight gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_WEBROOT: ${{ secrets.DEPLOY_WEBROOT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_WEBROOT: ${{ secrets.FTP_WEBROOT }}
        run: |
          node _platform/engine/cli.mjs check \
            --config "${{ inputs.config }}" \
            --env "${{ inputs.environment }}" \
            --dir "${{ steps.build.outputs.output_dir }}"

      # 4. Publish via the engine
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_WEBROOT: ${{ secrets.DEPLOY_WEBROOT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Legacy fallback names
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_WEBROOT: ${{ secrets.FTP_WEBROOT }}
        run: |
          EXECUTE=""
          if [ "${{ inputs.execute }}" = "true" ]; then EXECUTE="--execute"; fi
          node _platform/engine/cli.mjs deploy \
            --config "${{ inputs.config }}" \
            --env "${{ inputs.environment }}" \
            --sha "${{ github.sha }}" \
            --dir "${{ steps.build.outputs.output_dir }}" \
            $EXECUTE
