# Example resource registry. Real registries live in the platform's own config,
# never inside a client repo. Contains NO secrets — only ssh_key_ref names.
# Validate against ../schemas/registry.schema.json
schema_version: "1.0"

resources:

  # --- Our own VPS: platform owns allocation here ---
  - id: vps-01
    kind: vps
    provider: hetzner
    connection:
      host: 203.0.113.10
      port: 22
      username: platform
      ssh_key_ref: vps_01_ssh_key
    capacity:
      cpu: 4
      memory_mb: 8192
      storage_gb: 160
    base_path: /opt/deployments
    port_pools:
      backend:
        start: 5000
        end: 5099
      web:
        start: 8100
        end: 8199
    projects:
      - project: example-app
        environment: staging
        allocations:
          ports:
            - { service: backend, port: 5000, pool: backend }
            - { service: web, port: 8100, pool: web }
          domains:
            - { service: backend, domain: api.staging.example.com }
            - { service: web, domain: staging.example.com }
      - project: example-app
        environment: production
        allocations:
          ports:
            - { service: backend, port: 5001, pool: backend }
          domains:
            - { service: backend, domain: api.example.com }
            - { service: web, domain: example.com }
      - project: example-site-vps
        environment: production
        allocations:
          domains:
            - { service: site, domain: www.example.com }

  # --- Block-model VPS: each project gets a 50-port block; blue/green split inside it ---
  - id: vps-02
    kind: vps
    provider: hetzner
    connection:
      host: 203.0.113.20
      port: 22
      username: platform
      ssh_key_ref: vps_02_ssh_key
    base_path: /opt
    port_block:
      start: 5000
      end: 8000
      size: 50
    projects:
      - project: acadlynk
        environment: production
        block_base: 5000
        allocations:
          ports:
            - { service: backend, port: 5000, port_green: 5025 }
            - { service: web, port: 5001, port_green: 5026 }
            - { service: admin, port: 5002, port_green: 5027 }
          domains:
            - { service: backend, domain: api.acadlynk.com }
            - { service: web, domain: acadlynk.com }
            - { service: admin, domain: admin.acadlynk.com }

  # --- External managed host: no ports/capacity tracked (Rule 13) ---
  - id: hostinger-main
    kind: external
    provider: hostinger
    note: Shared hosting account for static sites; SSL managed via hPanel.
